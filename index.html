<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IKKY Store</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
 --primary:#e53935;
 --primary-dark:#c62828;
 --bg:#f5f5f5;
 --card:#ffffff;
}

*{
 margin:0;
 padding:0;
 box-sizing:border-box;
 font-family:'Poppins',sans-serif;
}

body{
 background:var(--bg);
}

/* HEADER */
.header{
 background:linear-gradient(135deg,var(--primary),var(--primary-dark));
 color:white;
 padding:15px;
 position:sticky;
 top:0;
 z-index:999;
}

.logo{
 font-size:24px;
 font-weight:700;
}

.search{
 margin-top:10px;
}

.search input{
 width:100%;
 padding:12px;
 border:none;
 border-radius:12px;
}

/* WALLET */
.wallet{
 margin:15px;
 background:white;
 border-radius:18px;
 padding:20px;
 box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.wallet h2{
 color:#333;
}

.balance{
 font-size:30px;
 font-weight:700;
 margin:10px 0;
}

.btn{
 border:none;
 padding:12px 18px;
 border-radius:10px;
 cursor:pointer;
 font-weight:600;
}

.deposit{
 background:var(--primary);
 color:white;
}

/* MENU */
.menu{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:10px;
 padding:15px;
}

.menu-item{
 background:white;
 padding:15px;
 text-align:center;
 border-radius:15px;
}

/* PRODUK */
.section{
 padding:15px;
}

.grid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:12px;
}

.card{
 background:white;
 border-radius:16px;
 overflow:hidden;
 box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.card img{
 width:100%;
 height:100px;
 object-fit:cover;
}

.card p{
 text-align:center;
 padding:10px;
 font-weight:600;
}

/* CRYPTO */
.crypto-card{
 margin:15px;
 background:white;
 border-radius:18px;
 padding:20px;
 text-align:center;
}

.trade-btn{
 display:inline-block;
 margin-top:15px;
 background:var(--primary);
 color:white;
 text-decoration:none;
 padding:12px 25px;
 border-radius:12px;
}

/* QR MODAL */
.modal{
 display:none;
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.7);
 justify-content:center;
 align-items:center;
 z-index:9999;
}

.modal-content{
 background:white;
 width:90%;
 max-width:400px;
 border-radius:20px;
 padding:20px;
 text-align:center;
}

.modal-content img{
 width:100%;
 border-radius:10px;
}

/* NAV */
.bottom-nav{
 position:fixed;
 bottom:0;
 width:100%;
 background:white;
 display:flex;
 justify-content:space-around;
 padding:10px;
 box-shadow:0 -2px 10px rgba(0,0,0,.1);
}
</style>
</head>

<body>

<div class="header">
 <div class="logo">IKKY STORE</div>

 <div class="search">
  <input type="text" placeholder="Cari produk...">
 </div>
</div>

<div class="wallet">
 <h2>Saldo Saya</h2>
 <div class="balance">Rp 250.000</div>

 <button class="btn deposit" onclick="openQR()">
  + Deposit Saldo
 </button>
</div>

<div class="menu">
 <div class="menu-item">🎮<br>Game</div>
 <div class="menu-item">💳<br>E-Wallet</div>
 <div class="menu-item">📱<br>Pulsa</div>
 <div class="menu-item">₿<br>Crypto</div>
</div>

<div class="section">
 <h2>🔥 Top Up Game</h2>

 <div class="grid">

  <div class="card">
   <img src="https://picsum.photos/300/200?1">
   <p>Mobile Legends</p>
  </div>

  <div class="card">
   <img src="https://picsum.photos/300/200?2">
   <p>Free Fire</p>
  </div>

  <div class="card">
   <img src="https://picsum.photos/300/200?3">
   <p>PUBG Mobile</p>
  </div>

 </div>
</div>

<div class="crypto-card">
 <h2>Crypto Exchange</h2>

 <p>
 Trading aset crypto secara real-time.
 </p>

 <a
 href="https://ikkyfx.vercel.app/"
 target="_blank"
 class="trade-btn">

 ⚡ Masuk Trading

 </a>
</div>

<div class="modal" id="qrModal">
 <div class="modal-content">

  <h2>Deposit Saldo</h2>

  <img src="qris.png" alt="QRIS">

  <p>Scan QRIS untuk deposit.</p>

  <br>

  <button class="btn deposit" onclick="closeQR()">
   Tutup
  </button>

 </div>
</div>

<div class="bottom-nav">
 <div>🏠<br>Home</div>
 <div>📦<br>Produk</div>
 <div>💰<br>Saldo</div>
 <div>📄<br>Riwayat</div>
 <div>👤<br>Akun</div>
</div>

<script>
function openQR(){
 document.getElementById('qrModal').style.display='flex';
}

function closeQR(){
 document.getElementById('qrModal').style.display='none';
}
</script>

</body>
</html>
